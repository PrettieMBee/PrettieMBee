name: Build PrettieMBee APK

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Build with Gradle
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: PrettieMBee-debug-${{ github.event.pull_request.number || github.run_number }}
        path: app/build/outputs/apk/debug/*.apk

    - name: Update Canary Pre-release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        SHORT_SHA="${GITHUB_SHA::7}"
        APK_SRC=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
        APK_NAME="PrettieMBee-canary-${SHORT_SHA}.apk"
        cp "$APK_SRC" "$APK_NAME"

        NOTES="Canary build from commit \`${SHORT_SHA}\` on \`main\`."

        if gh release view canary >/dev/null 2>&1; then
          gh release upload canary "$APK_NAME" --clobber

          ASSETS=$(gh release view canary --json assets --jq '.assets[].name')
          if [ -n "$ASSETS" ]; then
            while IFS= read -r asset; do
              if [ -n "$asset" ] && [ "$asset" != "$APK_NAME" ]; then
                gh release delete-asset canary "$asset" -y
              fi
            done <<< "$ASSETS"
          fi

          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/canary" \
            -f sha="${GITHUB_SHA}" \
            -F force=true

          gh release edit canary \
            --title "canary" \
            --prerelease=false \
            --latest \
            --notes "$NOTES"
        else
          gh release create canary "$APK_NAME" \
            --target "${GITHUB_SHA}" \
            --title "canary" \
            --latest \
            --notes "$NOTES"
        fi

    - name: Create GitHub Release on Tag
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/debug/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

